[package]
name = "epoch"
version = "0.1.0"
description = "Epoch: revenue-based credit and fee swaps for Solana validators"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "epoch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-sysvar = "5.0"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
bincode = "1.3"
proptest = "1.5"
solana-pubkey-v4 = { package = "solana-pubkey", version = "4.4" }
solana-vote-interface = { version = "7.1", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

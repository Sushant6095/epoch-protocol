name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: program (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  typescript:
    name: typescript (build, lint, test)
    runs-on: ubuntu-latest
    # Postgres for the DB tests (they skip without TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epoch
          POSTGRES_PASSWORD: epoch
          POSTGRES_DB: epoch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epoch -d epoch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://epoch:epoch@localhost:5432/epoch_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm ccd
      # Apply the migrations once, so test files that also migrate never race each other.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test

  app:
    name: app (typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace packages the app imports (@epoch/epoch-sdk) are consumed from their dist/.
      - run: pnpm --filter "app^..." build
      - run: pnpm --filter app typecheck
      - run: pnpm --filter app build

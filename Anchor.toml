[toolchain]
anchor_version = "1.2.0"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
epoch = "11111111111111111111111111111111"

[programs.devnet]
epoch = "11111111111111111111111111111111"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.base.json -t 1000000 tests/**/*.ts"
